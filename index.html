<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Mail-Werkstatt</title>
<style>
:root{--bg:#f5f3ff;--card:#ffffff;--ink:#1f1b2e;--mut:#5b5670;--ac:#6d28d9;--acbg:#ede9fe;--ok:#166534;--okbg:#dcf5e3;--no:#92400e;--nobg:#fdecd2;--ln:#cfc9e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17132b;--card:#221c3d;--ink:#f1eefc;--mut:#b8b0d6;--ac:#c4b5fd;--acbg:#3b2f6b;--ok:#86efac;--okbg:#153a24;--no:#fcd34d;--nobg:#3d2f10;--ln:#3d3566}}
:root[data-theme="dark"]{--bg:#17132b;--card:#221c3d;--ink:#f1eefc;--mut:#b8b0d6;--ac:#c4b5fd;--acbg:#3b2f6b;--ok:#86efac;--okbg:#153a24;--no:#fcd34d;--nobg:#3d2f10;--ln:#3d3566}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.6 Verdana,Tahoma,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.25rem;margin:.2em 0 .5em}
.card{background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:18px;margin:14px 0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
label{font-weight:bold;display:block;margin:.6em 0 .2em}
input,textarea{width:100%;font:inherit;padding:10px;border:2px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:130px}
button{font:inherit;cursor:pointer;border:2px solid var(--ac);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;margin:4px 4px 4px 0}
button.p{background:var(--ac);color:var(--bg);font-weight:bold}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--ac);outline-offset:2px}
.tabs button{padding:8px 12px;font-size:.9rem}.tabs button[aria-current=true]{background:var(--acbg);font-weight:bold}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--nobg);border-color:var(--no)}
.fb{padding:12px;border-radius:10px;margin:10px 0}.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.mail{border:2px solid var(--ln);border-radius:10px;padding:12px;background:var(--bg)}
.part{display:block;width:100%;text-align:left;margin:6px 0;border-style:dashed}
.small{color:var(--mut);font-size:.9rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{border:1px solid var(--ln);padding:6px 8px;text-align:left}
.chk li{margin:.4em 0;list-style:none}ul.chk{padding:0}
@media(prefers-reduced-motion:no-preference){.fb{transition:opacity .2s}}
</style></head><body><main>
<div class="top"><h1>E-Mail-Werkstatt</h1></div>
<div class="card"><label for="nm">Dein Name</label><input id="nm" autocomplete="off" spellcheck="false" placeholder="Hier deinen Namen schreiben">
<p id="sum" class="small" style="margin-bottom:0"></p></div>
<nav class="tabs" id="tabs"></nav>
<div id="v"></div>
</main>
<script>
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),st={};
const M={
aufbau:{t:"1 Aufbau",min:8,learn:`<h2>Aus welchen Teilen besteht eine E-Mail?</h2><p>Tippe auf einen Teil. Dann siehst du die Erklärung.</p>
<div class="mail">${[["An: anna@mail.at","An","Hier steht die E-Mail-Adresse von der Person, die deine E-Mail bekommt."],["Betreff: Hausübung Mathe","Betreff","Der Betreff sagt kurz: Worum geht es? Schreibe 2 bis 4 Wörter."],["Hallo Anna,","Anrede","Damit sprichst du die Person an. Nach der Anrede kommt ein Komma."],["Ich habe eine Frage zur Hausübung. Kannst du mir helfen?","Text","Hier schreibst du deine Nachricht. Kurze Sätze sind gut."],["Liebe Grüße<br>Max","Gruß und Name","Am Ende sagst du Tschüss und schreibst deinen Namen."]].map(p=>`<button class="part" data-i="${p[1]}|${p[2]}">${p[0]}</button>`).join("")}</div><div id="ex" class="fb ok" aria-live="polite">Tippe oben auf einen Teil.</div>`,items:[{q:"Bringe die E-Mail in die richtige Reihenfolge.",o:["Betreff","Anrede","Text","Gruß","Name"],w:"Erst Betreff, dann Anrede, Text, Gruß und zuletzt dein Name."},["Was ist eine E-Mail?",["Ein Brief am Computer","Ein Paket","Ein Spiel"],0,"Eine E-Mail ist Post am Computer oder Handy."],["„Hallo Anna,“ – Was ist das?",["Anrede","Betreff","Gruß"],0,"Die Anrede steht am Anfang."],["„Liebe Grüße, Max“ – Was ist das?",["Gruß und Name","Anrede","Betreff"],0,"Der Gruß steht am Ende."],["Was kommt ins Feld „An“?",["Die E-Mail-Adresse","Dein Name","Ein Bild"],0,"Im Feld „An“ steht die Adresse."],["Wo steht der Betreff?",["Ganz oben","Ganz unten","Im Gruß"],0,"Der Betreff steht oben."],["Nach der Anrede steht …",["ein Komma","ein Punkt","nichts"],0,"Nach der Anrede kommt ein Komma."]]},
betreff:{t:"2 Betreff",min:4,learn:`<h2>Der Betreff</h2><p>Der Betreff sagt kurz: <b>Worum geht es?</b><br>2 bis 4 Wörter. Kein ganzer Satz. Nie leer.</p>`,items:[["Du fragst die Lehrerin wegen der Hausübung.",["Frage zur Hausübung","Hallo!!!","Ich wollte fragen, ob ich die Hausübung für Mathe nochmal bekommen kann"],0,"Kurz und klar."],["Du lädst Lena zum Geburtstag ein.",["Einladung zum Geburtstag","(leer lassen)","Hey"],0,"Der Betreff ist nie leer."],["Du bist krank und schreibst an den Direktor.",["Krankmeldung","Hilfe!!!","Ich bin heute krank und kann nicht kommen"],0,"Ein Wort reicht: Krankmeldung."],["Welcher Betreff ist zu lang?",["Turnstunde Freitag","Frage zur Turnstunde","Ich wollte fragen, wann die Turnstunde am Freitag ist"],2,"Zu lang. Ein Betreff ist kurz."],["Du fragst die Bibliothek nach den Öffnungszeiten.",["Öffnungszeiten","Wichtig!!!","Hallo"],0,"Der Betreff nennt das Thema."]]},
adr:{t:"3 Adressen",min:6,learn:`<h2>E-Mail-Adresse</h2><p>Name <b>@</b> Anbieter <b>.at</b><br>Zum Beispiel: <b>max.huber@mail.at</b><br>Keine Leerzeichen. Alles klein. Nur ein @.</p>`,items:[["Welche Adresse ist richtig?",["max.huber@mail.at","max huber@mail.at","max.huber.mail.at"],0,"Mit @ und ohne Leerzeichen."],["Welche Adresse hat einen Fehler?",["lena@mail.at","lena@@mail.at","lena.k@mail.at"],1,"Nur ein @ ist erlaubt."],["Du suchst ein Praktikum. Welche Adresse ist sinnvoll?",["anna.berger@mail.at","superstar123@mail.at","killerkatze@mail.at"],0,"Dein Name ist seriös. Spitznamen passen nicht."],["Welche Adresse passt für Herrn Müller?",["herrmueller@schule.at","herr müller@schule.at","herrmueller.schule.at"],0,"Ohne Leerzeichen, mit @."],["Welche Adresse passt nicht zur Schule?",["tim.meier@mail.at","partyking99@mail.at","frauberger@schule.at"],1,"Eine Spaß-Adresse passt nicht."],{q:"Baue die Adresse zusammen.",o:["max.huber","@","mail",".","at"],w:"max.huber@mail.at"}]},
anl:{t:"4 Anliegen",min:5,learn:`<h2>Das Anliegen</h2><p>Sage freundlich und klar, was du willst.<br>Ein Satz, ein Gedanke. Mit „bitte“ und „danke“.</p>`,items:[{q:"Bringe den Satz in Ordnung.",o:["Können","Sie","mir","bitte","helfen?"],w:"Können Sie mir bitte helfen?"},["Welcher Satz ist höflich?",["Können Sie mir bitte helfen?","Hilf mir jetzt!","Ich will Hilfe."],0,"Mit „bitte“ und als Frage."],["Du schreibst an Tim. Welcher Satz sagt klar, was du willst?",["Kannst du mir die Hausübung schicken?","Es ist viel passiert.","Hallo, ich wollte schreiben."],0,"Klar: Was willst du von Tim?"],["Welches Wort macht eine Bitte höflich?",["bitte","jetzt","sofort"],0,"„Bitte“ macht es freundlich."],["Wie endet eine höfliche Bitte?",["Vielen Dank!","Mach schnell!","Tschau!"],0,"Mit „Vielen Dank!“."],{q:"Bringe den Satz in Ordnung.",o:["Ich","möchte","gern","beim","Schulfest","helfen."],w:"Ich möchte gern beim Schulfest helfen."}]},
dusie:{t:"5 du oder Sie?",min:5,learn:`<h2>du oder Sie?</h2><table><tr><th>Wem?</th><th>Form</th></tr><tr><td>Freund*innen, Familie, Mitschüler*innen</td><td>du</td></tr><tr><td>Lehrer*innen, Direktion, Firmen</td><td>Sie</td></tr></table>`,items:[["Du schreibst an deine Freundin.",["du","Sie"],0,"Freund*innen: du."],["Du schreibst an Frau Berger, die Lehrerin.",["Sie","du"],0,"Lehrer*innen: Sie."],["Du schreibst an deinen Opa.",["du","Sie"],0,"Familie: du."],["Du schreibst an den Direktor.",["Sie","du"],0,"Direktion: Sie."],["Du schreibst an eine Firma.",["Sie","du"],0,"Firmen: Sie."],["Du schreibst an Tim aus deiner Klasse.",["du","Sie"],0,"Mitschüler*innen: du."]]},
anrede:{t:"6 Anrede & Gruß",min:5,learn:`<h2>Anrede und Gruß</h2><table><tr><th></th><th>du</th><th>Sie</th></tr><tr><td>Anrede</td><td>Liebe Lena,<br>Lieber Tim,</td><td>Sehr geehrte Frau …,<br>Sehr geehrter Herr …,</td></tr><tr><td>Gruß</td><td>Liebe Grüße</td><td>Mit freundlichen Grüßen</td></tr></table>`,items:[["An Frau Berger:",["Sehr geehrte Frau Berger,","Hallo Berger,","Liebe Berger,"],0,"Frau → „Sehr geehrte“."],["An Herrn Huber:",["Sehr geehrter Herr Huber,","Sehr geehrte Herr Huber,","Hey Herr Huber,"],0,"Herr → „Sehr geehrter“."],["An deine Freundin Lena:",["Liebe Lena,","Lieber Lena,","Sehr geehrte Lena,"],0,"Mädchen → „Liebe“."],["An deinen Freund Tim:",["Lieber Tim,","Liebe Tim,","Sehr geehrter Tim,"],0,"Bub → „Lieber“."],["Höflicher Gruß:",["Mit freundlichen Grüßen","LG","Ciao"],0,"Höflich: „Mit freundlichen Grüßen“."],["Gruß an eine Freundin:",["Liebe Grüße","Mit freundlichen Grüßen","Hochachtungsvoll"],0,"Persönlich: „Liebe Grüße“."]]},
pron:{t:"7 Pronomen",min:6,learn:`<h2>du und Sie</h2><table><tr><th>Fall</th><th>Frage</th><th>du</th><th>Sie</th></tr><tr><td>1. Fall</td><td>wer?</td><td>du</td><td>Sie</td></tr><tr><td>2. Fall</td><td>wessen?</td><td>dein, deine</td><td>Ihr, Ihre</td></tr><tr><td>3. Fall</td><td>wem?</td><td>dir</td><td>Ihnen</td></tr><tr><td>4. Fall</td><td>wen?</td><td>dich</td><td>Sie</td></tr></table><p class="small">Sie, Ihnen, Ihr schreibt man groß.</p>`,items:[["Frau Berger, können ___ mir helfen?",["Sie","du","dir"],0,"Sie-Form, 1. Fall (wer?)."],["Lena, kannst ___ morgen kommen?",["du","Sie","Ihnen"],0,"Lena ist eine Freundin: du."],["Herr Huber, ich danke ___.",["Ihnen","dir","Sie"],0,"danken + wem? → Ihnen."],["Tim, ich danke ___.",["dir","Ihnen","dich"],0,"danken + wem? → dir."],["Frau Meier, ich habe ___ Nachricht gelesen.",["Ihre","Deine","Dein"],0,"wessen Nachricht? → Ihre."],["Anna, danke für ___ Nachricht!",["deine","Ihre","Sie"],0,"wessen Nachricht? → deine."],["Frau Berger, ich möchte ___ etwas fragen.",["Sie","dir","Ihnen"],0,"wen? → Sie."]]},
test:{t:"8 Test",min:7,learn:`<h2>Test</h2><p>10 Fragen aus allen Übungen.<br>Du schaffst das!</p>`,items:()=>sh(Object.keys(M).filter(x=>x!="test").flatMap(x=>M[x].items.filter(Array.isArray))).slice(0,10)}};
const SC=[{f:"du",who:"deine Freundin Lena",n:"Lena",e:"lena@mail.at",task:"Lade Lena zu deinem Geburtstag am Samstag ein.",h:"Ich habe am Samstag Geburtstag. Kommst du? Wir treffen uns um …"},
{f:"Sie",who:"deine Lehrerin Frau Berger",n:"Berger",e:"frauberger@schule.at",task:"Du warst krank. Frage, was du als Hausübung machen musst.",h:"Ich war gestern krank. Können Sie mir bitte sagen, …?"},
{f:"du",who:"dein Opa",n:"Opa",e:"opa@opa.at",task:"Erzähle deinem Opa, was du am Wochenende gemacht hast.",h:"Am Wochenende war ich … Wie geht es dir?"},
{f:"Sie",who:"Herr Huber, der Direktor",n:"Huber",e:"herrhuber@schule.at",task:"Du möchtest beim Schulfest helfen. Frage höflich, ob das geht.",h:"Ich möchte gern beim Schulfest helfen. Ist das möglich?"},
{f:"Sie",who:"Herr Müller, dein Sportlehrer",n:"Müller",e:"herrmueller@schule.at",task:"Du kannst am Freitag nicht zur Turnstunde kommen. Entschuldige dich höflich.",h:"Ich kann am Freitag leider nicht kommen. Bitte entschuldigen Sie …"},
{f:"du",who:"dein Mitschüler Tim",n:"Tim",e:"tim@mail.at",task:"Frage Tim, ob er dir das Buch leihen kann.",h:"Kannst du mir bitte das Buch … leihen? Danke im Voraus!"},
{f:"Sie",who:"Frau Meier von der Bibliothek",n:"Meier",e:"fraumeier@bibliothek.at",task:"Frage, wann die Bibliothek geöffnet hat.",h:"Können Sie mir bitte sagen, wann die Bibliothek geöffnet hat?"}];
function upd(){$("#tabs").innerHTML=[...Object.keys(M),"schr","ueb"].map(k=>`<button data-k="${k}" ${cur==k?'aria-current="true"':''}>${k=="ueb"?"Übersicht":k=="schr"?"Extra: Schreiben":M[k].t}${st[k]?" "+"⭐".repeat(st[k]):""}</button>`).join("");
$("#sum").textContent=Object.keys(st).length?"Meine Sterne: "+[...Object.keys(M),"schr"].map((k,i)=>(k=="schr"?"Extra":i+1)+": "+"⭐".repeat(st[k]||0)+(st[k]?"":"–")).join("   "):"Mache eine Übung. Dann siehst du hier deine Sterne.";}
let cur="aufbau";const L=[],now=()=>new Date().toLocaleString("de-AT"),nm=()=>($("#nm").value.trim()||"(ohne Name)");
function csv(){const q=x=>'"'+String(x).replace(/"/g,'""').replace(/\n/g," / ")+'"';return "\ufeff"+[["Name","Datum","Übung","Aufgabe / Frage","Antwort","Ergebnis","Hinweis"],...L.map(r=>[nm(),r.t,r.m,r.q,r.a,r.r,r.h||""])].map(r=>r.map(q).join(";")).join("\r\n");}
function ov(){const rows=Object.keys(M).map(k=>{const r=L.filter(x=>x.m==M[k].t);return `<tr><td>${M[k].t}</td><td>${r.length}</td><td>${r.filter(x=>x.r=="richtig").length}</td><td>${"⭐".repeat(st[k]||0)||"–"}</td></tr>`}).join(""),w=L.filter(x=>x.m=="Schreiben"),
c=x=>String(x).replace(/[\t\r\n]+/g," "),tx=[["Name","Datum","Übung","Aufgabe / Frage","Antwort","Ergebnis","Hinweis"],...L.map(r=>[nm(),r.t,r.m,r.q,r.a,r.r,r.h||""])].map(r=>r.map(c).join("\t")).join("\n");
$("#v").innerHTML=`<div class="card"><h2>Meine Übersicht</h2><p><b>${nm()}</b> · ${now()}</p><table><tr><th>Übung</th><th>Antworten</th><th>Richtig</th><th>Sterne</th></tr>${rows}<tr><td>Extra: Schreiben</td><td>${w.length} E-Mails</td><td>–</td><td>${"⭐".repeat(st.schr||0)||"–"}</td></tr></table></div>
<div class="card"><h2>Ergebnis abgeben</h2>${L.length?"":"<p>Mache zuerst eine Übung.</p>"}<p><b>Möglichkeit 1:</b> Datei speichern (Excel).</p><button class="p" id="dl">Datei speichern</button><p id="dm" class="small" aria-live="polite"></p>
<p><b>Möglichkeit 2:</b> Text kopieren und abschicken. In Excel eingefügt, entstehen Spalten.</p><textarea id="tx" readonly>${tx.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</textarea><button id="cp">Text kopieren</button><p class="small">Möglichkeit 3: Mache einen Screenshot von dieser Seite.</p></div>`;
$("#dl").onclick=async()=>{const m=$("#dm");try{const d=window.claude&&await claude.use("downloads");if(!d){m.textContent="Speichern geht hier nicht. Nimm Möglichkeit 2 oder 3.";return}await d.save({filename:"E-Mail-Uebung_"+nm().replace(/\s+/g,"_")+".csv",data:csv()});m.textContent="Gespeichert! ✔"}catch(e){m.textContent=e&&e.code=="declined"?"Nicht gespeichert.":"Speichern hat nicht geklappt. Nimm Möglichkeit 2 oder 3."}};
$("#cp").onclick=()=>{const t=$("#tx");t.select();try{document.execCommand("copy");$("#cp").textContent="Kopiert ✔"}catch(e){}};}
function show(k){cur=k;upd();if(k=="ueb")return ov();if(k=="schr")return wr();const m=M[k];$("#v").innerHTML=`<div class="card">${m.learn}</div><div class="card"><h2>Übung</h2><p>⏱ ca. ${m.min} Minuten. Du kannst so oft üben, wie du willst.</p><button class="p" id="go">Übung starten</button></div>`;
$("#go").onclick=()=>quiz(k);document.querySelectorAll(".part").forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.i.split("|");const t=m.learn.match(new RegExp(c.replace("ß","ß")+"[^\\]]*?\\]"));const e={"An":"Hier steht die E-Mail-Adresse von der Person, die deine E-Mail bekommt.","Betreff":"Der Betreff sagt kurz: Worum geht es? Schreibe 2 bis 4 Wörter.","Anrede":"Damit sprichst du die Person an. Nach der Anrede kommt ein Komma.","Text":"Hier schreibst du deine Nachricht. Kurze Sätze sind gut.","Gruß und Name":"Am Ende sagst du Tschüss und schreibst deinen Namen."};$("#ex").textContent=c+": "+e[c];});}
function quiz(k){const it=sh(typeof M[k].items=="function"?M[k].items():M[k].items),n=it.length;let i=0,ok=0;
function ordq(x){const pool=sh(x.o);let ch=[];const dr=()=>{$("#v").innerHTML=`<div class="card"><p class="small">Aufgabe ${i+1} von ${n}</p><h2>${x.q}</h2><p class="small">Tippe in der richtigen Reihenfolge.</p><div class="mail" style="min-height:3em">${ch.map((c,j)=>`<div>${j+1}. ${c}</div>`).join("")||"…"}</div><div>${pool.filter(o=>!ch.includes(o)).map(o=>`<button class="opt">${o}</button>`).join("")}</div><button id="un">Zurück</button><div id="f" aria-live="polite"></div></div>`;
$("#un").onclick=()=>{ch.pop();dr()};document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ch.push(b.textContent);if(ch.length<x.o.length)return dr();const r=ch.join("|")==x.o.join("|");if(r)ok++;L.push({t:now(),m:M[k].t,q:x.q,a:ch.join(" "),r:r?"richtig":"falsch",h:r?"":"Richtig wäre: "+x.o.join(" ")});dr();document.querySelectorAll(".opt,#un").forEach(y=>y.disabled=true);
$("#f").innerHTML=`<div class="fb ${r?"ok":"no"}"><b>${r?"Richtig! ✔":"Fast. So ist es richtig:"}</b><br>${r?x.w:x.o.join(" → ")+"<br>"+x.w}</div><button class="p" id="nx">${i+1<n?"Weiter":"Fertig"}</button>`;$("#nx").focus();$("#nx").onclick=()=>{i++;i<n?q():end();};});};dr();}
function q(){if(!Array.isArray(it[i]))return ordq(it[i]);const[t,o,a,w]=it[i],c=o[a];$("#v").innerHTML=`<div class="card"><p class="small">Frage ${i+1} von ${n}</p><h2>${t}</h2><div id="o">${sh(o).map(x=>`<button class="opt">${x}</button>`).join("")}</div><div id="f" aria-live="polite"></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const r=b.textContent==c;if(r)ok++;L.push({t:now(),m:M[k].t,q:t,a:b.textContent,r:r?"richtig":"falsch",h:r?"":"Richtig wäre: "+c});document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent==c)x.classList.add("ok");});if(!r)b.classList.add("no");
$("#f").innerHTML=`<div class="fb ${r?"ok":"no"}"><b>${r?"Richtig! ✔":"Fast. Richtig ist: "+c}</b><br>${w}</div><button class="p" id="nx">${i+1<n?"Weiter":"Fertig"}</button>`;$("#nx").focus();$("#nx").onclick=()=>{i++;i<n?q():end();};});}
function end(){const s=ok/n>=.9?3:ok/n>=.7?2:ok/n>=.4?1:0;st[k]=Math.max(st[k]||0,s);upd();$("#v").innerHTML=`<div class="card"><h2>Geschafft!</h2><p>${ok} von ${n} richtig. ${"⭐".repeat(s)||"Übe noch einmal, dann klappt es besser."}</p><button class="p" id="ag">Noch einmal üben</button><button id="bk">Zurück</button></div>`;$("#ag").onclick=()=>quiz(k);$("#bk").onclick=()=>show(k);}
q();}
function wr(){let s=SC[Math.floor(Math.random()*SC.length)];
$("#v").innerHTML=`<div class="card"><h2>Schreibe eine E-Mail</h2><p><b>Du schreibst an:</b> ${s.who}<br><b>E-Mail-Adresse:</b> ${s.e}<br><b>Form:</b> ${s.f=="du"?"du-Form":"Sie-Form"}<br><b>Aufgabe:</b> ${s.task}</p><button id="hb">Hilfe anzeigen</button><p id="hp" class="small" hidden>Satzanfang: „${s.h}“</p>
<label for="a">An (E-Mail-Adresse)</label><input id="a" autocomplete="off" spellcheck="false"><label for="b">Betreff</label><input id="b" autocomplete="off"><label for="c">Anrede</label><input id="c" autocomplete="off"><label for="d">Text</label><textarea id="d"></textarea><label for="e">Gruß</label><input id="e" autocomplete="off"><label for="g">Dein Name</label><input id="g" autocomplete="off">
<p><button class="p" id="ck">Prüfen</button><button id="nw">Neue Aufgabe</button></p><div id="r" aria-live="polite"></div></div>`;
$("#hb").onclick=()=>{$("#hp").hidden=false};$("#nw").onclick=wr;
$("#ck").onclick=()=>{const v=x=>$("#"+x).value.trim(),d=v("d"),du=s.f=="du",C=[];
const add=(o,t,h)=>C.push([o,t,h]);
